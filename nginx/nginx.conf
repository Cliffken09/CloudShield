worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 10r/m is a genuine brake on scripted brute force against one account
    # from one IP (5r/s + burst 10 was ~300 attempts/min — a speed bump,
    # not a limit). It does not stop credential stuffing, which spreads
    # attempts across many IPs and walks under any per-IP limit by design.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    # nginx's default rejection status is 503 — 429 is the correct,
    # standard "you're rate limited" code and is what the frontend's
    # security demo looks for.
    limit_req_status 429;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # The app also sets these itself (defense in depth for local dev
        # without nginx in front) — hide its copy so the edge response
        # carries each header exactly once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # /metrics is deliberately not proxied — Prometheus reaches the app
        # directly over the internal Docker network instead.
        location /metrics {
            return 404;
        }

        # Only the credential-guessing endpoints get the strict budget.
        # GET /auth/me (probed on every page load/reload) and /auth/logout
        # aren't brute-force targets — scoping the whole /auth/ prefix to
        # auth_limit meant a couple of page refreshes could burn through
        # the same tiny budget and lock a legitimate user out of logging
        # back in.
        location /auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /auth/register {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /auth/ {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(vault|health)($|/) {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger/Redoc pull their UI bundle from a third-party CDN, so this
        # location relaxes the CSP (dev-only tooling — disable via DOCS_URL
        # in a real deployment) while keeping the other security headers.
        location ~ ^/(docs|openapi\.json|redoc)($|/) {
            limit_req zone=general_limit burst=40 nodelay;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
